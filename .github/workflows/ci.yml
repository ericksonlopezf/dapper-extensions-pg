name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    uses: ericksonlopezf/dotnet-shared-kernel/.github/workflows/dotnet-build-test.yml@main
    with:
      test-filter: "Category!=Integration"
      artifact-name: unit-test-results

  integration-tests:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    # Integration tests require Docker — ubuntu-latest has it pre-installed

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Run integration tests (Testcontainers pulls PostgreSQL image)
        run: >
          dotnet test
          --no-build
          --configuration Release
          --filter "Category=Integration"
          --logger "trx;LogFileName=integration-test-results.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./test-results/
